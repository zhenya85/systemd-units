<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Конструктор systemd-юнитов</title>
    <style>
        :root {
            --bg: #f4f6f9;
            --card: #fff;
            --ink: #18222d;
            --mut: #617083;
            --line: #d9e0e8;
            --acc: #0f7b8a;
            --acc2: #1f3a5f;
            --code: #0f1a26;
            --codeink: #d7e3ef;
            --k: #7fd1de;
            --v: #f3c98b;
            --c: #6f8397;
            --h: #9fd48a;
            --err: #c0283f;
            --warn: #b26a00;
            --tip: #0f7b8a;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            color-scheme: light
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #0e141b;
                --card: #161f29;
                --ink: #e4ebf2;
                --mut: #93a3b5;
                --line: #263341;
                --acc: #4fc3d3;
                --acc2: #8db4e8;
                --code: #091017;
                --err: #ff7a8c;
                --warn: #f0b35a;
                --tip: #4fc3d3;
                color-scheme: dark
            }
        }

        :root[data-theme="dark"] {
            --bg: #0e141b;
            --card: #161f29;
            --ink: #e4ebf2;
            --mut: #93a3b5;
            --line: #263341;
            --acc: #4fc3d3;
            --acc2: #8db4e8;
            --code: #091017;
            --err: #ff7a8c;
            --warn: #f0b35a;
            --tip: #4fc3d3;
            color-scheme: dark
        }

        * {
            box-sizing: border-box
        }

        html, body {
            height: auto
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif
        }

        header {
            padding: 18px 20px 6px;
            max-width: 1280px;
            margin: 0 auto
        }

        h1 {
            margin: 0;
            font-size: 22px;
            color: var(--acc2)
        }

        header p {
            margin: 4px 0 0;
            color: var(--mut);
            font-size: 13.5px
        }

        main {
            max-width: 1280px;
            margin: 0 auto;
            padding: 10px 20px 40px;
            display: grid;
            grid-template-columns:minmax(0, 1.05fr) minmax(0, 1fr);
            gap: 18px;
            align-items: start
        }

        @media (max-width: 900px) {
            main {
                grid-template-columns:1fr
            }

            .sticky {
                position: static !important
            }
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 14px
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center
        }

        .seg button, .chip, .btn {
            font: inherit;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--ink);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer
        }

        .seg button.on {
            background: var(--acc);
            border-color: var(--acc);
            color: #fff
        }

        .chip {
            font-size: 13px;
            padding: 4px 10px;
            border-radius: 99px
        }

        .chip:hover, .btn:hover {
            border-color: var(--acc)
        }

        .btn.p {
            background: var(--acc2);
            color: #fff;
            border-color: var(--acc2)
        }

        label.l {
            display: block;
            font-size: 12.5px;
            color: var(--mut);
            margin: 0 0 3px
        }

        label.l b {
            font-family: ui-monospace, Consolas, monospace;
            color: var(--acc2);
            font-weight: 600
        }

        input[type=text], select, textarea {
            width: 100%;
            font: 13.5px ui-monospace, Consolas, monospace;
            padding: 7px 9px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--bg);
            color: var(--ink)
        }

        textarea {
            resize: vertical;
            min-height: 56px
        }

        input:focus, select:focus, textarea:focus {
            outline: 2px solid var(--acc);
            outline-offset: -1px
        }

        details {
            border-top: 1px solid var(--line);
            padding: 10px 0 2px
        }

        details:first-of-type {
            border-top: 0
        }

        summary {
            cursor: pointer;
            font-weight: 600;
            color: var(--acc2);
            padding-bottom: 8px
        }

        .grid {
            display: grid;
            grid-template-columns:1fr 1fr;
            gap: 10px 12px
        }

        @media (max-width: 560px) {
            .grid {
                grid-template-columns:1fr
            }
        }

        .full {
            grid-column: 1/-1
        }

        .chk {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            font: 13px ui-monospace, Consolas, monospace;
            padding: 4px 0
        }

        .chk input {
            margin-top: 3px
        }

        .hint {
            font: 12px system-ui;
            color: var(--mut);
            display: block
        }

        .sticky {
            position: sticky;
            top: 12px
        }

        pre {
            margin: 0;
            background: var(--code);
            color: var(--codeink);
            border-radius: 10px;
            padding: 14px;
            font: 13px/1.55 ui-monospace, Consolas, monospace;
            overflow-x: auto;
            white-space: pre;
            max-height: 62vh;
            overflow-y: auto
        }

        .hk {
            color: var(--h);
            font-weight: 700
        }

        .kk {
            color: var(--k)
        }

        .vv {
            color: var(--v)
        }

        .cc {
            color: var(--c);
            font-style: italic
        }

        .lint {
            margin: 8px 0 0;
            padding: 0;
            list-style: none;
            font-size: 13px
        }

        .lint li {
            padding: 5px 0 5px 10px;
            border-left: 3px solid var(--tip)
        }

        .lint .err {
            border-color: var(--err);
            color: var(--err)
        }

        .lint .warn {
            border-color: var(--warn);
            color: var(--warn)
        }

        .lint .tip {
            color: var(--ink)
        }

        .cmd {
            font: 12.5px ui-monospace, Consolas, monospace;
            white-space: pre-wrap;
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 10px;
            margin: 8px 0 0
        }

        .note {
            margin-top: 5px;
            padding: 6px 9px;
            border-left: 3px solid var(--acc);
            background: var(--bg);
            border-radius: 0 6px 6px 0;
            font: 12.5px/1.4 system-ui, sans-serif;
            color: var(--ink)
        }

        .note code {
            font: 12px ui-monospace, Consolas, monospace;
            color: var(--acc2);
            font-weight: 600
        }

        .note.off {
            border-color: var(--line);
            color: var(--mut)
        }

        h3 {
            margin: 0 0 8px;
            font-size: 14px;
            color: var(--acc2)
        }
    </style>
</head>
<body>
<header><h1>Конструктор systemd-юнитов</h1>
    <p>Выберите тип, заполните поля — готовый файл, проверки и команды установки появятся справа. Всё считается в
        браузере.</p></header>
<main>
    <section>
        <div class="card">
            <div class="row seg" id="types"></div>
            <div class="row" style="margin-top:10px">
                <div style="flex:1;min-width:160px"><label class="l">Имя юнита (без расширения)</label><input
                        type="text" id="name" value="myapp"></div>
                <label class="chk" style="margin-top:16px"><input type="checkbox" id="user"> пользовательский
                    (--user)</label></div>
            <div class="row" style="margin-top:10px"><span class="hint">Шаблоны:</span><span class="row"
                                                                                             id="presets"></span></div>
        </div>
        <div class="card" id="form"></div>
    </section>
    <section class="sticky">
        <div class="card">
            <div class="row" style="justify-content:space-between;margin-bottom:8px"><h3 id="fname"
                                                                                         style="margin:0"></h3>
                <span class="row"><button class="btn" id="cp" data-l="Копировать">Копировать</button><button class="btn"
                                                                                                             id="rst"
                                                                                                             title="Очистить форму">Сбросить</button></span>
            </div>
            <label class="chk" id="pairWrap" style="display:none"><input type="checkbox" id="pair" checked> добавить
                заготовку связанной службы</label>
            <pre id="out"></pre>
            <ul class="lint" id="lint"></ul>
        </div>
        <div class="card">
            <div class="row" style="justify-content:space-between"><h3 style="margin:0">Установка и запуск</h3>
                <button class="btn" id="cp2" data-l="Копировать">Копировать</button>
            </div>
            <div class="cmd" id="cmds"></div>
        </div>
    </section>
</main>
<script>
  const $ = s => document.querySelector(s),
    esc = s => s.replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));
  const T = (k, p, h) => [k, 't', p || '', h || ''], A = (k, p, h) => [k, 'a', p || '', h || ''],

  const SEC = {

    Service: [S('Type', ['', 'simple', 'exec', 'forking', 'oneshot', 'notify', 'dbus', 'idle'], 'Как systemd определяет готовность'), T('ExecStart', '/usr/bin/myapp --port 8080', 'Абсолютный путь обязателен'), A('ExecStartPre', '/usr/bin/test -f /etc/myapp.conf', 'По одной команде в строке'), T('ExecReload', '/bin/kill -HUP $MAINPID'), T('ExecStop'), T('User', 'myapp'), T('Group', 'myapp'), B('DynamicUser', 'Временный пользователь на время работы'), B('RemainAfterExit', 'Для oneshot: оставаться active'), T('WorkingDirectory', '/opt/myapp'), A('Environment', 'NODE_ENV=production', 'KEY=VALUE, по одной в строке'), T('EnvironmentFile', '-/etc/default/myapp', '«-» — не ошибка, если файла нет'), S('Restart', ['', 'no', 'on-failure', 'always', 'on-abnormal', 'on-success', 'on-watchdog', 'on-abort']), T('RestartSec', '5s'), T('TimeoutStopSec', '30s'), T('StateDirectory', 'myapp', '→ /var/lib/myapp'), T('RuntimeDirectory', 'myapp', '→ /run/myapp'), T('LimitNOFILE', '65535'), S('StandardOutput', ['', 'journal', 'null', 'inherit', 'journal+console']), T('SyslogIdentifier', 'myapp'), S('KillMode', ['', 'control-group', 'mixed', 'process', 'none']), S('OOMPolicy', ['', 'continue', 'stop', 'kill']), T('UMask', '0027'), T('Nice', '10'), T('PIDFile', '/run/myapp/myapp.pid', 'Для Type=forking'), T('WatchdogSec', '30s', 'Для Type=notify')],
    Security: [B('NoNewPrivileges', 'Запрет повышения привилегий'), B('PrivateTmp', 'Собственный /tmp'), B('PrivateDevices', 'Минимальный /dev'), S('ProtectSystem', ['', 'yes', 'full', 'strict']), S('ProtectHome', ['', 'yes', 'read-only', 'tmpfs']), S('ProtectProc', ['', 'default', 'noaccess', 'invisible', 'ptraceable']), S('DevicePolicy', ['', 'auto', 'closed', 'strict']), B('ProtectKernelTunables'), B('ProtectKernelModules'), B('ProtectKernelLogs'), B('ProtectControlGroups'), B('ProtectClock'), B('ProtectHostname'), B('RestrictSUIDSGID'), B('RestrictRealtime'), B('RestrictNamespaces'), B('LockPersonality'), B('MemoryDenyWriteExecute', 'Не для JIT: Node.js, Java'), B('PrivateNetwork', 'Только loopback'), T('RestrictAddressFamilies', 'AF_UNIX AF_INET AF_INET6'), T('SystemCallFilter', '@system-service'), T('CapabilityBoundingSet', 'CAP_NET_BIND_SERVICE', 'Пусто = без capabilities'), T('AmbientCapabilities', 'CAP_NET_BIND_SERVICE'), T('ReadWritePaths', '/var/lib/myapp /var/log/myapp'), T('IPAddressDeny', 'any'), T('IPAddressAllow', '127.0.0.1 10.0.0.0/8')],
    Resources: [T('CPUQuota', '150%', '100% = одно ядро'), T('CPUWeight', '100', '1–10000'), T('MemoryHigh', '900M', 'Мягкий лимит'), T('MemoryMax', '1G', 'Жёсткий лимит (OOM)'), T('MemorySwapMax', '0'), T('TasksMax', '512'), T('IOWeight', '100', '1–10000'), T('Slice', 'workers.slice')],

  const SECTAG = {Security: 'Service', Resources: 'Service'}; // выводятся в секцию [Service]
  const TITLE = {
    Unit: 'Unit — описание и зависимости',
    Service: 'Service — запуск',
    Security: 'Песочница и безопасность',
    Resources: 'Ресурсы (cgroups)',
    Timer: 'Timer — расписание',
    Socket: 'Socket — прослушивание',
    Path: 'Path — события ФС',
    Install: 'Install — автозапуск'
  };
  const HARD = {
    NoNewPrivileges: 1,
    PrivateTmp: 1,
    PrivateDevices: 1,
    ProtectSystem: 'strict',
    ProtectHome: 'yes',
    ProtectKernelTunables: 1,
    ProtectKernelModules: 1,
    ProtectKernelLogs: 1,
    ProtectControlGroups: 1,
    ProtectClock: 1,
    ProtectHostname: 1,
    RestrictSUIDSGID: 1,
    RestrictRealtime: 1,
    RestrictNamespaces: 1,
    LockPersonality: 1,
    RestrictAddressFamilies: 'AF_UNIX AF_INET AF_INET6',
    SystemCallFilter: '@system-service',
    CapabilityBoundingSet: ''
  };
  const PRE = {
    'Веб-приложение': {
      type: 'service',
      name: 'myapp',
      v: {
        Description: 'Веб-приложение MyApp',
        After: 'network-online.target',
        Wants: 'network-online.target',
        Type: 'exec',
        ExecStart: '/opt/myapp/venv/bin/gunicorn app:app --bind 127.0.0.1:8000',
        ExecReload: '/bin/kill -HUP $MAINPID',
        User: 'myapp',

        WorkingDirectory: '/opt/myapp',

  /* Пояснения к конкретным значениям */
  const VAL = {

  const BOOLS = new Set(Object.values(SEC).flat().filter(x => x[1] === 'b').map(x => x[0]));

  function noteEl(k) {
    const v = st.v[k], g = GEN[k] || '', x = VAL[k] && VAL[k][v], hasV = !!(VAL[k] || OPT[k]);
    if (BOOLS.has(k)) return v ? `<div class="note" id="n_${k}"><code>${k}=yes</code> — ${esc(g)}</div>` : `<div class="note off" id="n_${k}">Если включить: ${esc(g)}</div>`;
    if (v) return `<div class="note" id="n_${k}"><code>${k}=${esc(String(v).split('\n')[0])}</code> — ${esc(x || g || 'своё значение')}</div>`;
    return `<div class="note off" id="n_${k}">${esc(g)}${hasV ? ' Выберите значение — здесь появится пояснение.' : ''}</div>`
  }

  function updNote(k) {
    const el = document.getElementById('n_' + k);
    if (el) el.outerHTML = noteEl(k)
  }

  function fieldHTML([k, kind, p, h]) {
    const v = st.v[k], id = 'f_' + k, n = noteEl(k);
    if (kind === 'b') return `<div class="full"><label class="chk"><input type="checkbox" data-k="${k}" ${v ? 'checked' : ''}><span>${k}=yes</span></label>${n}</div>`;
    const lab = `<label class="l" for="${id}"><b>${k}=</b></label>`, o = kind === 's' ? p : OPT[k];
    if (o) {
      const vs = v || '', cust = kind !== 's' && vs !== '' && !o.includes(vs);
      return `<div>${lab}<select id="${id}" data-sel="${k}"><option value="">— не задано —</option>${o.filter(x => x !== '').map(x => `<option value="${esc(x)}" ${x === vs ? 'selected' : ''}>${esc(x)}</option>`).join('')}${kind !== 's' ? `<option value="__c" ${cust ? 'selected' : ''}>другое значение…</option>` : ''}</select>${kind !== 's' ? `<input type="text" data-k="${k}" placeholder="${esc(p)}" value="${cust ? esc(vs) : ''}" style="margin-top:6px;${cust ? '' : 'display:none'}">` : ''}${n}</div>`
    }
    if (kind === 'a') return `<div class="full">${lab}<textarea id="${id}" data-k="${k}" placeholder="${esc(p)}" rows="2">${esc(v || '')}</textarea>${n}</div>`;
    return `<div>${lab}<input type="text" id="${id}" data-k="${k}" placeholder="${esc(p)}" value="${esc(v || '')}">${n}</div>`
  }

  function buildForm() {
    const secs = SHOW[st.type];
    $('#form').innerHTML = secs.map((s, i) => {
      const f = SEC[s];
      const hard = s === 'Security' ? `<div class="row" style="margin-bottom:8px"><button class="btn" data-act="hard">Применить базовое усиление</button><span class="hint">набор из документа, раздел 6</span></div>` : '';
      const flds = f.filter(x => x[1] !== 'b'), bools = f.filter(x => x[1] === 'b');
      return `<details ${i < 2 || s === 'Install' ? 'open' : ''}><summary>${TITLE[s]}</summary>${hard}<div class="grid">${flds.map(x => fieldHTML(x)).join('')}</div>${bools.length ? `<div class="grid" style="margin-top:6px">${bools.map(x => fieldHTML(x)).join('')}</div>` : ''}<div style="margin-top:10px"><label class="l"><b>свои строки</b> (Key=Value) в секцию [${NAMES[s]}]</label><textarea data-k="_raw_${s}" rows="2" placeholder="Nice=10">${esc(st.v['_raw_' + s] || '')}</textarea></div></details>`
    }).join('');
    document.querySelectorAll('#types button').forEach(b => b.classList.toggle('on', b.dataset.t === st.type));
    render()
  }

  function lines() {
    const secs = SHOW[st.type], out = {Unit: [], Service: [], Timer: [], Socket: [], Path: [], Install: []};
    secs.forEach(s => {
      const tgt = NAMES[s];
      SEC[s].forEach(([k, kind]) => {
        const v = st.v[k];
        if (kind === 'b') {
          if (v) out[tgt].push(k + '=yes')
        } else if (kind === 'a') {
          (v || '').split('\n').map(x => x.trim()).filter(Boolean).forEach(x => out[tgt].push(k + '=' + x))
        } else if (v !== undefined && v !== '' || k === 'CapabilityBoundingSet' && v === '' && st.v._cap) {
          out[tgt].push(k + '=' + (v || ''))
        }
      });
      (st.v['_raw_' + s] || '').split('\n').map(x => x.trim()).filter(Boolean).forEach(x => out[tgt].push(x))
    });
    return out
  }

  function build() {
    const o = lines(), main = st.type[0].toUpperCase() + st.type.slice(1);
    let t = [];
    ['Unit', main, 'Install'].forEach(sn => {
      if (o[sn].length) t.push('[' + sn + ']\n' + o[sn].join('\n'))
    });
    let txt = t.join('\n\n');
    if (st.type !== 'service' && st.pair) {
      const n = st.name || 'myapp', desc = st.v.Description || n;
      txt += `\n\n# ——— ${n}.service (запускается этим юнитом) ———\n[Unit]\nDescription=${desc}\n\n[Service]\n${st.type === 'timer' ? 'Type=oneshot\n' : ''}ExecStart=/usr/local/bin/${n}.sh`
    }
    return txt
  }

  function hl(txt) {
    return txt.split('\n').map(l => {
      const e = esc(l);
      if (/^\[.+\]$/.test(l)) return `<span class="hk">${e}</span>`;
      if (/^#/.test(l)) return `<span class="cc">${e}</span>`;
      const i = l.indexOf('=');
      return i > 0 ? `<span class="kk">${esc(l.slice(0, i))}</span>=<span class="vv">${esc(l.slice(i + 1))}</span>` : e
    }).join('\n')
  }

  function lint() {
    const v = st.v, r = [], add = (lv, m) => r.push([lv, m]);
    if (st.type === 'service') {
      if (!v.ExecStart) add('err', 'Не задан ExecStart= — служба не запустится.');
      else if (!/^[-@:+!]*\//.test(v.ExecStart.trim())) add('err', 'ExecStart= должен начинаться с абсолютного пути (допустимы префиксы - @ : + !).');
      else if (/[|&;><]/.test(v.ExecStart) && !/sh -c|bash -c/.test(v.ExecStart)) add('warn', 'В ExecStart= нет оболочки: операторы | && > ; не сработают. Оберните в /bin/sh -c \'…\'.');
      if (/%/.test(v.ExecStart || '') && /[^%]%[^%nNiIpPtSCLEuUhHmbvwjJfsl]/.test(v.ExecStart || '')) add('warn', 'Одиночный «%» воспринимается как спецификатор — удвойте: %%.');
      if (v.Type === 'forking' && !v.PIDFile) add('warn', 'Type=forking без PIDFile= — главный PID определяется угадыванием.');
      if (v.Type === 'oneshot' && v.Restart === 'always') add('err', 'Restart=always несовместим с Type=oneshot.');
      if (v.Type === 'notify' && !v.WatchdogSec) add('tip', 'Type=notify: приложение должно отправлять READY=1 через sd_notify, иначе запуск зависнет до тайм-аута.');
      if ((v.Restart === 'always' || v.Restart === 'on-failure') && !v.RestartSec) add('tip', 'Задайте RestartSec= (например 5s), чтобы сбойная служба не перезапускалась каждые 100 мс.');
      if (!v.Restart && v.Type !== 'oneshot') add('tip', 'Restart= не задан — после падения служба останется остановленной.');
      if (!v.User && !v.DynamicUser) add('tip', 'User= не задан: служба работает от root. Используйте отдельного пользователя или DynamicUser=yes.');
      if (v.User && v.DynamicUser) add('warn', 'Одновременно User= и DynamicUser=yes: имя будет создано динамически — проверьте, нужно ли оно.');
      if (v.ProtectSystem === 'strict' && !v.ReadWritePaths && !v.StateDirectory && !v.RuntimeDirectory) add('warn', 'ProtectSystem=strict делает ФС только для чтения: добавьте StateDirectory= или ReadWritePaths=, если приложение что-то пишет.');
      if (v.MemoryDenyWriteExecute && /node|java|dotnet|chrome|php/.test(v.ExecStart || '')) add('warn', 'MemoryDenyWriteExecute= ломает JIT (Node.js, Java, .NET) — отключите для таких приложений.');
      if (v.ProtectHome && /\/home\//.test((v.ExecStart || '') + (v.WorkingDirectory || ''))) add('warn', 'Путь в /home при ProtectHome= станет недоступен.');
      if (v.PrivateNetwork && (v.ListenStream)) add('warn', 'PrivateNetwork=yes отрезает сеть — служба не сможет слушать порты.');
      if (v.MemoryMax && v.MemoryHigh && parseInt(v.MemoryHigh) > parseInt(v.MemoryMax)) add('warn', 'MemoryHigh= больше MemoryMax= — «мягкий» лимит бессмыслен.');
      if (v.Wants && /network-online/.test(v.After || '') === false && /network-online/.test(v.Wants)) add('tip', 'Wants=network-online.target работает только вместе с After=network-online.target.');
    }
    if (st.type === 'timer') {
      if (!v.OnCalendar && !v.OnBootSec && !v.OnUnitActiveSec) add('err', 'Не задан ни один триггер: OnCalendar=, OnBootSec= или OnUnitActiveSec=.');
      if (v.Persistent && !v.OnCalendar) add('warn', 'Persistent= действует только вместе с OnCalendar=.');
      if (v.OnCalendar && /\d{1,2}:\d{1,2}(?!:)/.test(v.OnCalendar) === false && !/(minutely|hourly|daily|weekly|monthly|yearly|quarterly|semiannually|\*)/.test(v.OnCalendar)) add('tip', 'Проверьте выражение: systemd-analyze calendar "' + v.OnCalendar.split('\n')[0] + '"');
      add('tip', 'Таймер запускает одноимённую службу (' + (st.name || 'имя') + '.service) — она должна существовать.');
    }
    if (st.type === 'socket') {
      if (!v.ListenStream && !v.ListenDatagram) add('err', 'Задайте ListenStream= или ListenDatagram=.');
      if (v.Accept === 'yes') add('tip', 'Accept=yes: нужен шаблон ' + (st.name || 'имя') + '@.service.');
      add('tip', 'Служба ' + (st.name || 'имя') + '.service получит сокет как файловый дескриптор (LISTEN_FDS, начиная с fd 3).');
    }
    if (st.type === 'path' && !v.PathExists && !v.PathChanged && !v.DirectoryNotEmpty) add('err', 'Задайте PathExists=, PathChanged= или DirectoryNotEmpty=.');
    if (!v.WantedBy && !st.user) add('tip', 'WantedBy= не задан: systemctl enable не создаст ссылку автозапуска.');
    if (st.user && v.WantedBy && v.WantedBy !== 'default.target') add('tip', 'Для пользовательских юнитов обычно WantedBy=default.target.');
    if (!v.Description) add('tip', 'Добавьте Description= — оно показывается в статусе и журнале.');
    return r
  }

  function render() {
    const n = (st.name || 'unit').replace(/[^\w@.\-:\\]/g, '-'), ext = '.' + st.type, fn = n + ext, txt = build();
    $('#fname').textContent = fn;
    $('#out').innerHTML = hl(txt) || '<span class="cc"># заполните поля слева</span>';
    $('#pairWrap').style.display = st.type === 'service' ? 'none' : 'flex';
    const L = lint();
    $('#lint').innerHTML = L.length ? L.map(([c, m]) => `<li class="${c}">${esc(m)}</li>`).join('') : '<li class="tip">Замечаний нет ✓</li>';
    const u = st.user, sc = u ? 'systemctl --user' : 'sudo systemctl',
      dir = u ? '~/.config/systemd/user' : '/etc/systemd/system', p = dir + '/' + fn;
    let c = `${u ? 'mkdir -p ' + dir + '\n' : ''}${u ? 'nano' : 'sudo nano'} ${p}\nsystemd-analyze ${u ? '--user ' : ''}verify ${p}\n${sc} daemon-reload\n${sc} enable --now ${fn}\n${sc} status ${fn}\n${u ? 'journalctl --user' : 'journalctl'} -u ${fn} -f`;
    if (st.type === 'timer') c += `\n${sc} list-timers ${fn}`;
    if (st.type !== 'service' && st.pair) c = `${u ? 'nano' : 'sudo nano'} ${dir}/${n}.service\n` + c;
    if (u) c += '\nloginctl enable-linger $USER   # запуск без входа в систему';
    $('#cmds').textContent = c;
    try {
      localStorage.setItem('unitbuilder', JSON.stringify(st))
    } catch (e) {
    }
  }

  function copy(text, btn) {
    const ok = () => {
      btn.textContent = 'Скопировано ✓';
      setTimeout(() => btn.textContent = btn.dataset.l, 1400)
    };
    const fb = () => {
      const a = document.createElement('textarea');
      a.value = text;
      a.style.position = 'fixed';
      a.style.opacity = '0';
      document.body.appendChild(a);
      a.select();
      try {
        document.execCommand('copy');
        ok()
      } catch (e) {
      }
      a.remove()
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fb); else fb()
  }

  function applyPreset(p) {
    st.type = p.type;
    st.name = p.name;
    st.v = Object.assign({}, p.v);
    if (p.v.CapabilityBoundingSet === '') st.v._cap = 1;
    $('#name').value = p.name;
    buildForm()
  }

  $('#types').innerHTML = Object.keys(SHOW).map(t => `<button data-t="${t}">.${t}</button>`).join('');
  $('#presets').innerHTML = Object.keys(PRE).map(k => `<button class="chip" data-p="${k}">${k}</button>`).join('');
  $('#types').onclick = e => {
    const t = e.target.dataset.t;
    if (t) {
      st.type = t;
      buildForm()
    }
  };
  $('#presets').onclick = e => {
    const p = e.target.dataset.p;
    if (p) applyPreset(PRE[p])
  };
  $('#name').oninput = e => {
    st.name = e.target.value.trim();
    render()
  };
  $('#user').onchange = e => {
    st.user = e.target.checked;
    render()
  };
  $('#pair').onchange = e => {
    st.pair = e.target.checked;
    render()
  };
  $('#form').addEventListener('input', e => {
    const k = e.target.dataset.k;
    if (!k) return;
    st.v[k] = e.target.type === 'checkbox' ? (e.target.checked ? 1 : 0) : e.target.value;
    updNote(k);
    render()
  });
  $('#form').addEventListener('change', e => {
    const k = e.target.dataset.sel;
    if (!k) return;
    const inp = e.target.parentNode.querySelector('input[data-k="' + k + '"]'), val = e.target.value;
    if (val === '__c') {
      inp.style.display = '';
      inp.focus();
      st.v[k] = inp.value
    } else {
      if (inp) {
        inp.style.display = 'none';
        inp.value = ''
      }
      st.v[k] = val
    }
    updNote(k);
    render()
  });
  $('#form').addEventListener('click', e => {
    if (e.target.dataset.act === 'hard') {
      Object.assign(st.v, HARD, {_cap: 1});
      buildForm()
    }
  });
  $('#cp').onclick = e => copy($('#out').textContent, e.target);
  $('#cp2').onclick = e => copy($('#cmds').textContent, e.target);
  $('#rst').onclick = () => {
    st.v = {};
    buildForm()
  };
  try {
    const s = JSON.parse(localStorage.getItem('unitbuilder') || 'null');
    if (s && s.v && SHOW[s.type]) {
      Object.assign(st, s);
      $('#name').value = st.name;
      $('#user').checked = st.user;
      $('#pair').checked = st.pair
    } else applyPreset(PRE['Веб-приложение'])
  } catch (e) {
    applyPreset(PRE['Веб-приложение'])
  }
  buildForm();
</script>
</body>
</html>
